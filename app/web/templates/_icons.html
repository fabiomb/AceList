{# Inline icons (Lucide-style strokes), sized by CSS and colored with currentColor.
   Decorative: the button or link that holds one carries the accessible name. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "play" %}<polygon points="6 3 20 12 6 21 6 3"/>
{%- elif name == "edit" %}<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
{%- elif name == "delete" %}<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
{%- endif %}</svg>
{%- endmacro %}
